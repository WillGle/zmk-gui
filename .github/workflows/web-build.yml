name: web-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and build web app
        run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: curve-e-web
          path: |
            dist/
            LICENSE
            NOTICE
          if-no-files-found: error
          retention-days: 7
